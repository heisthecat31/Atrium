[package]
name = "atrium"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "One home for every VR headset and game, with its own OpenXR runtime."
repository = "https://github.com/atrium-vr/atrium"
build = "build.rs"

[[bin]]
name = "atrium"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.32", default-features = false, features = ["glow", "default_fonts", "wayland", "x11"] }
egui_extras = { version = "0.32", features = ["image", "svg", "file", "http"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
sha2 = "0.10"
rand = "0.8"
open = "5"
rfd = "0.15"
dirs = "6"
url = "2"
wry = "0.53"
tao = "0.34"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Memory", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
codegen-units = 4
